# 鹊动后端 — Nginx 反向代理配置（HTTPS / Let's Encrypt）
#
# 安装位置：/etc/nginx/sites-available/quedong
# 启用：sudo ln -s /etc/nginx/sites-available/quedong /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
#
# 前置：
#   1) 域名 A 记录已指向本机公网 IP（如 quedong.example.com）
#   2) 安装 certbot：sudo apt install certbot python3-certbot-nginx
#   3) 申请证书（会自动改写本文件注入证书路径）：
#      sudo certbot --nginx -d quedong.example.com
#   4) 证书自动续期已随 certbot 安装（systemd timer），无需额外配置
#
# ✅ 安全状态：后端已在 server.js 对 /api/sync、/api/media、/api/ai 挂载
#   authMiddleware（Bearer 令牌鉴权）。公网直接暴露已安全，无需临时 IP 白名单止损。
#   当前模型为「共享诊所数据集」（任意登录用户可读写共享记录）；如需多诊所隔离见 README 扩展章节。

# ── HTTP 80：仅服务于 ACME 校验并全量跳转 HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name quedong.example.com;

    # Let's Encrypt HTTP-01 校验目录（certbot 自动写入/读取）
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # 其余全部 301 跳转 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 443 ──
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name quedong.example.com;

    # === certbot 会自动填充以下两行（首次申请证书后）===
    # ssl_certificate     /etc/letsencrypt/live/quedong.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/quedong.example.com/privkey.pem;

    # 若证书尚未申请，可临时用自签（仅测试）：
    # ssl_certificate     /etc/ssl/certs/ssl-cert-snakeoil.pem;
    # ssl_certificate_key /etc/ssl/private/ssl-cert-snakeoil.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头（HSTS 仅在证书稳定后启用，避免锁死）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # add_header Strict-Transport-Security "max-age=31536000" always;  # 稳定后取消注释

    # 大文件上传（媒体最大 200MB）：放宽请求体上限与超时
    client_max_body_size 256m;
    client_body_timeout 600s;
    proxy_read_timeout 600s;
    proxy_connect_timeout 30s;

    # ── 前端静态资源：由 nginx 直接托管（性能更好）──
    # 哈希路由（#/xxx）不会命中服务器，try_files 回落 index.html 是安全的
    root /opt/quedong/frontend;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 可选网络层加固（默认注释）：如需进一步限制来源网段，可启用 IP 白名单 ──
    # 注意：后端已对 /api/sync、/api/media、/api/ai 启用令牌鉴权，此段仅为额外网络层限制，
    # 非必需。把 203.0.113.0/24 换成你的公司出口 IP / VPN 网段；多个用多行 allow。
    # location ~ ^/(api/sync|api/media|api/ai) {
    #     allow 203.0.113.0/24;
    #     deny all;
    #     proxy_pass http://127.0.0.1:8080;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # ── 后端 API 与媒体：反代到本地 Node ──
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查（监控/负载均衡探活用）
    location = /health {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
}
