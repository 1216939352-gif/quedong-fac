# 鹊动系统 · 生产反向代理（AI 能力上线用）
# 用法：include 进 nginx.conf 的 http 段，或放 /etc/nginx/sites-enabled/
# 假设后端 Node 跑在 127.0.0.1:8080；AI Key 仅在后端，本层不触碰。

upstream quedong_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name quedong.example.com;   # 改成你的域名

    ssl_certificate     /etc/ssl/quedong/fullchain.pem;
    ssl_certificate_key /etc/ssl/quedong/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 安全响应头
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 50m;   # 媒体上传

    # API（含 /api/ai）：反代到 Node 后端，并限流保护
    location /api/ {
        limit_req zone=ai_limit burst=20 nodelay;
        proxy_pass http://quedong_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # AI 推理可能较慢
    }

    # 前端静态（若由 nginx 直出更快；否则也反代给后端）
    location / {
        proxy_pass http://quedong_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 限流区（放在 http 段）
# limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/s;

server {
    listen 80;
    server_name quedong.example.com;
    return 301 https://$host$request_uri;   # 强制 HTTPS
}
