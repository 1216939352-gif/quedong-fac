<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>鹊动FAC功能评估与干预系统</title>
  <link rel="stylesheet" href="styles.css" />
<script src="https://beacon.cdn.qq.com/sdk/4.5.9/beacon_web.min.js"></script>
<script>
(function(){
  try{
    var beacon=new BeaconAction({
      appkey:'0WEB06U85YBSLJNL',
      versionCode:'1.0.0',
      channelID:'share',
      delay:1000,
      sessionDuration:30*60*1000,
      isOversea:false,
      needReportRqdEvent:false
    });
    beacon.onDirectUserAction('preview_page_view',{
      'url':location.href,
      'referrer':document.referrer,
      'title':document.title,
      'sandbox_id':'444917095f3440ccaeecdc0abbbc1ae5'
    });
  }catch(e){}
})();
</script></head>
<body>
  <div id="app"></div>

  <!-- 页面模板容器 -->
  <template id="tpl-login">
    <div class="login-page">
      <div class="login-hero">
        <div class="login-hero-orbs" aria-hidden="true">
          <span class="hero-orb hero-orb-1"></span>
          <span class="hero-orb hero-orb-2"></span>
          <span class="hero-orb hero-orb-3"></span>
        </div>
        <div class="login-hero-inner">
          <div class="login-brand">
            <img src="images/logo.png" alt="鹊动 Logo" onerror="this.style.display='none'" />
            <div class="login-brand-texts">
              <span class="login-brand-main">鹊动FAC</span>
              <span class="login-brand-sub">功能评估与干预系统</span>
            </div>
          </div>

          <div class="login-hero-stage">
          <div class="login-hero-deco" aria-hidden="true">
            <svg class="deco-svg" viewBox="0 0 480 360" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="decoGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" class="g-stop-1" />
                  <stop offset="1" class="g-stop-2" />
                </linearGradient>
                <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
                  <circle cx="2" cy="2" r="1.5" class="f-grid" />
                </pattern>
              </defs>

              <rect x="0" y="0" width="480" height="360" fill="url(#dotGrid)" />

              <g transform="translate(340,140)">
                <circle r="34" class="s-muted" />
                <circle r="62" class="s-muted" />
                <circle r="92" class="s-faint" />
                <circle r="120" class="s-faint" />
              </g>

              <path class="deco-wave s-primary-grad" d="M0,250 C90,190 170,300 280,235 C360,188 430,250 480,210" />
              <path class="deco-wave deco-wave-2 s-accent" d="M0,288 C100,250 190,330 300,278 C380,240 440,288 480,262" />

              <path class="deco-line s-accent" d="M40,300 L110,252 L170,272 L240,196 L310,214 L388,120" />
              <circle cx="388" cy="120" r="5" class="f-accent" />
              <circle cx="240" cy="196" r="3.5" class="f-accent" />
              <circle cx="110" cy="252" r="3.5" class="f-accent" />

              <circle cx="60" cy="120" r="3" class="f-primary" />
              <circle cx="200" cy="90" r="2.5" class="f-muted" />
              <circle cx="440" cy="300" r="3" class="f-primary" />
              <line x1="150" y1="60" x2="210" y2="60" class="s-muted" />
              <line x1="40" y1="180" x2="40" y2="240" class="s-muted" />
            </svg>
          </div>
          <img class="login-hero-img" src="images/home-hero.png" alt="鹊动FAC功能评估与干预系统" onerror="this.style.display='none'" />
          </div>

          <div class="login-hero-tagline">功能评估.数智驱动.全程管理</div>
        </div>
      </div>
      <div class="login-card">
        <div class="login-header">
          <img src="images/logo.png" alt="鹊动 Logo" />
          <div class="login-header-texts">
            <h1>鹊动FAC</h1>
            <p>功能评估与干预系统</p>
          </div>
        </div>
        <div class="login-body">
          <div class="login-tabs">
            <div class="login-tab active" data-tab="login">账号登录</div>
            <div class="login-tab" data-tab="register">注册账号</div>
          </div>
          <form id="login-form">
            <div class="form-row" style="grid-template-columns: 1fr;">
              <div class="form-group">
                <label>用户名 <span class="required">*</span></label>
                <input type="text" name="username" placeholder="请输入用户名" required />
              </div>
              <div class="form-group">
                <label>密码 <span class="required">*</span></label>
                <input type="password" name="password" placeholder="请输入密码" required />
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:8px;">登 录</button>
          </form>
          <form id="register-form" class="hidden">
            <div class="form-row" style="grid-template-columns: 1fr;">
              <div class="form-group">
                <label>真实姓名 <span class="required">*</span></label>
                <input type="text" name="displayName" required />
              </div>
              <div class="form-group">
                <label>用户名 <span class="required">*</span></label>
                <input type="text" name="username" placeholder="字母数字，至少3位" required />
              </div>
              <div class="form-group">
                <label>登录密码 <span class="required">*</span></label>
                <input type="password" name="password" placeholder="至少6位" required />
              </div>
              <div class="form-group">
                <label>确认密码 <span class="required">*</span></label>
                <input type="password" name="passwordConfirm" required />
              </div>
              <div class="form-group">
                <label>联系手机号</label>
                <input type="tel" name="phone" />
              </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%; margin-top:8px;">注 册</button>
          </form>
        </div>
      </div>
    </div>
  </template>

  <template id="tpl-app-shell">
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <img src="images/logo.png" alt="Logo" />
          <div class="sidebar-brand-text">
            鹊动FAC
            <small>功能评估与干预系统</small>
          </div>
        </div>
        <nav class="sidebar-nav" id="sidebar-nav"></nav>
        <div class="sidebar-footer">
          内测版 V3.0.1
        </div>
      </aside>
      <div class="main-area">
        <header class="topbar">
          <div class="topbar-left">
            <button class="mobile-menu-btn" id="mobile-menu-btn">☰</button>
            <h2 class="page-title" id="page-title">工作台</h2>
          </div>
          <div class="topbar-actions">
            <button class="btn btn-ghost" id="theme-toggle" title="切换主题">🌓</button>
            <span id="current-user-name" style="font-size:14px; color:var(--text-secondary);"></span>
            <button class="btn btn-secondary btn-sm" id="logout-btn">退出登录</button>
          </div>
        </header>
        <main class="content-area" id="main-content"></main>
      </div>
    </div>
  </template>

  <!-- 1. 数据层与常量算法（先加载，供全局引用） -->
  <script src="lib/db.js"></script>
  <script src="lib/pdf-parser.js"></script>
  <script src="lib/excel-parser.js"></script>
  <script src="lib/qrcode.min.js"></script>
  <script src="modules/ocr.js"></script>
  <script src="modules/constants.js"></script>
  <script src="modules/diagrams.js"></script>
  <script src="modules/calc.js"></script>
  <!-- 2. 核心应用层（声明 AppState / U / Pages 容器，注册 __BOOT__，不自动运行） -->
  <script src="modules/themes.js"></script>
  <script src="app.js"></script>
  <!-- 3. 页面模块（向 Pages 容器填充各页面实现，必须在 app.js 之后） -->
  <script src="modules/patient.js"></script>
  <script src="modules/assessment.js"></script>
  <script src="modules/lifestyle.js"></script>
  <script src="modules/plan.js"></script>
  <script src="modules/isokinetic.js"></script>
  <script src="modules/isotonic.js"></script>
  <script src="modules/report.js"></script>
  <script src="modules/center.js"></script>
  <script src="modules/bigdata.js"></script>
  <script src="modules/styleguide.js"></script>
  <script src="modules/admin.js"></script>
  <script src="modules/planlib.js"></script>
  <script src="modules/share.js"></script>
  <!-- 4. 所有模块就绪后启动 -->
  <script>window.__BOOT__ && window.__BOOT__();</script>
</body>
</html>
