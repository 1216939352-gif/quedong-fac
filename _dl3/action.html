<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>鹊动 · 动作视频</title>
  <style>
    :root {
      --primary: #f26522;
      --primary-dark: #d24f12;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 520px; margin: 0 auto; padding: 16px; }
    .brand {
      display: flex; align-items: center; gap: 10px; margin-bottom: 16px;
    }
    .brand img { height: 36px; object-fit: contain; }
    .brand span { font-weight: 700; color: var(--primary); font-size: 16px; }
    .card {
      background: var(--card-bg); border-radius: 16px; padding: 18px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 14px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .label { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .value { font-size: 15px; margin-top: 4px; }
    .caution { color: var(--danger); font-size: 14px; margin-top: 12px; padding: 10px; background: #fef2f2; border-radius: 8px; }
    .video-wrap { margin: 14px 0; border-radius: 12px; overflow: hidden; background: #000; }
    video { width: 100%; display: block; max-height: 70vh; }
    .video-tip { font-size: 13px; color: var(--muted); padding: 12px; text-align: center; }
    .empty { text-align: center; padding: 40px 20px; color: var(--muted); }
    .empty img { width: 80px; margin-bottom: 12px; opacity: .7; }
    .footer { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">
      <img src="images/logo.png" alt="鹊动" onerror="this.style.display='none'" />
      <span>鹊动FAC</span>
    </div>
    <div id="content"></div>
    <div class="footer">本页面由鹊动评估与干预系统生成</div>
  </div>

  <script>
    function $(sel) { return document.querySelector(sel); }
    function esc(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    function decodeData() {
      const params = new URLSearchParams(location.search);
      const data = params.get('data');
      if (!data) return null;
      try {
        const json = decodeURIComponent(escape(atob(data)));
        return JSON.parse(json);
      } catch (e) {
        console.error('动作数据解析失败', e);
        return null;
      }
    }

    const action = decodeData();
    const box = $('#content');

    if (!action) {
      box.innerHTML = `
        <div class="card empty">
          <p>未找到动作数据，请扫描医生端生成的有效二维码。</p>
        </div>`;
    } else {
      const hasVideo = action.video && (action.video.startsWith('http://') || action.video.startsWith('https://'));
      let videoBlock = '';
      if (hasVideo) {
        videoBlock = `
          <div class="video-wrap">
            <video controls playsinline poster="images/logo.png" preload="metadata">
              <source src="${esc(action.video)}" type="video/mp4" />
              您的浏览器不支持视频播放
            </video>
          </div>`;
      } else if (action.video) {
        videoBlock = `
          <div class="video-wrap">
            <div class="video-tip">该动作视频存储在医生工作站本地，无法通过扫码跨设备播放。<br>如需手机查看，请让医生将视频更换为在线链接（如腾讯云、阿里云、B 站等外链）。</div>
          </div>`;
      } else {
        videoBlock = `<div class="video-wrap"><div class="video-tip">该动作暂无视频演示</div></div>`;
      }

      box.innerHTML = `
        <div class="card">
          <h1>${esc(action.name)}</h1>
          <div class="meta">${esc(action.categoryLabel || '抗阻训练')}${action.target ? ' · ' + esc(action.target) : ''}</div>
          ${videoBlock}
          <div class="label">训练剂量</div>
          <div class="value">${esc(action.dose || '按阶段参数执行')}</div>
          <div class="label">动作要领</div>
          <div class="value">${esc(action.key || '—')}</div>
          ${action.caution ? `<div class="caution">注意：${esc(action.caution)}</div>` : ''}
        </div>`;
    }
  </script>
</body>
</html>
